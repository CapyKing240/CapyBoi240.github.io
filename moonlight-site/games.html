<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Moonlight Studiost</title>
  <meta name="description" content="Every game from Moonlight Studios, with screenshots, videos and links to play.">
  <meta name="theme-color" content="#0a0e2a">
  <link rel="icon" href="Images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="games">
  <main id="app">
    <div class="container page-intro">
      <h1>Our games</h1>
      <p>Pick a game to see screenshots and videos, read its devlogs and play it on itch.io.</p>
    </div>
    <section class="section-tight container">
      <div class="chips" id="games-filters" role="group" aria-label="Filter games by status" style="margin-bottom:1.8rem"></div>
      <div class="game-grid" id="games-grid"></div>
    </section>
  </main>
  <noscript><p style="padding:2rem;text-align:center">This site needs JavaScript turned on to show its games and devlogs.</p></noscript>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
