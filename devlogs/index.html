<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Devlogs | Moonlight Studios</title>
  <meta name="description" content="News and development notes from every Moonlight Studios game.">
  <meta name="theme-color" content="#0a0e2a">
  <link rel="icon" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="devlogs">
  <main id="app">
    <div class="container page-intro">
      <h1>Devlogs</h1>
      <p>Studio news, and notes on how each game is made. Filter by game, or pick General for updates about the studio.</p>
    </div>
    <section class="section-tight container">
      <div class="log-tools">
        <div class="chips" id="log-filters" role="group" aria-label="Filter devlogs"></div>
        <div class="search"><label class="sr-only" for="log-search">Search devlogs</label><input id="log-search" type="search" placeholder="Search devlogs" autocomplete="off"></div>
      </div>
      <p id="log-count" style="color:var(--dim);margin-bottom:.8rem" aria-live="polite"></p>
      <div class="log-list" id="log-list"></div>
    </section>
  </main>
  <noscript><p style="padding:2rem;text-align:center">This site needs JavaScript turned on to show its games and devlogs.</p></noscript>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
